server.port=8080
spring.application.name=production-spring-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:produser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SecurePassword123!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Expose Actuator and Prometheus Endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
